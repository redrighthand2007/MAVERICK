name: tests

# Once per PR into main, and once more after it's merged. Pushes to build don't run it (the PR does),
# and changes that only touch docs (.md files, docs/) skip it: they can't break a test.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

jobs:
  test:
    # MAVERICK is Windows-only (power modes, services, devices); system calls are faked in the tests.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,minilm]"
      - name: Test
        # No MiniLM model files here (they're gitignored), so this also proves the ensemble fallback works.
        run: python -m pytest -q
